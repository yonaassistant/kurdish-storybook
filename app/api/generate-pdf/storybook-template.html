<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Patrick+Hand&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Patrick Hand', 'Noto Sans Arabic', sans-serif;
      background: #fff;
    }
    
    .page {
      width: 210mm;
      height: 297mm;
      padding: 15mm;
      page-break-after: always;
      position: relative;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .cover-page {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      text-align: center;
    }
    
    .cover-title {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      font-family: 'Patrick Hand', cursive;
    }
    
    .cover-subtitle {
      font-size: 28px;
      margin-bottom: 40px;
      font-family: 'Noto Sans Arabic', sans-serif;
    }
    
    .cover-image {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 8px solid white;
      margin: 30px auto;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .story-page {
      background: white;
      border: 10px solid #667eea;
      border-radius: 20px;
      padding: 30px;
    }
    
    .page-number {
      position: absolute;
      bottom: 20px;
      right: 30px;
      font-size: 18px;
      color: #667eea;
      font-weight: bold;
    }
    
    .text-section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9ff;
      border-radius: 15px;
      border-left: 5px solid #667eea;
    }
    
    .text-label {
      font-size: 14px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    
    .kurdish-text {
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 22px;
      line-height: 1.8;
      direction: rtl;
      text-align: right;
      color: #2d3748;
    }
    
    .english-text {
      font-family: 'Patrick Hand', cursive;
      font-size: 22px;
      line-height: 1.6;
      color: #2d3748;
    }
    
    .illustration {
      width: 100%;
      max-width: 400px;
      height: 250px;
      margin: 20px auto;
      border-radius: 15px;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .decorative-border {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    
    .corner {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.5);
    }
    
    .corner.top-left {
      top: 10px;
      left: 10px;
      border-right: none;
      border-bottom: none;
    }
    
    .corner.top-right {
      top: 10px;
      right: 10px;
      border-left: none;
      border-bottom: none;
    }
    
    .corner.bottom-left {
      bottom: 10px;
      left: 10px;
      border-right: none;
      border-top: none;
    }
    
    .corner.bottom-right {
      bottom: 10px;
      right: 10px;
      border-left: none;
      border-top: none;
    }
  </style>
</head>
<body>
  {{PAGES}}
</body>
</html>
