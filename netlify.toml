[build]
  command = "npm run build"
  publish = ".next"

[functions]
  # Increase memory and timeout for Puppeteer
  node_bundler = "esbuild"
  included_files = ["node_modules/@sparticuz/chromium/**/*"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next.js function configuration
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/___netlify-server-handler"
  status = 200
